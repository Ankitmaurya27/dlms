<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Defence Logistics Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--dg:#1c2a1a;--ol:#4b5a2f;--kh:#c9b98b;--of:#f2f0e6;--bk:#0f130e;--bd:#b5b08f;--g:#2e7d32;--a:#e6a700;--o:#e0701a;--r:#c62828;--b:#2a5d9f}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 'Source Sans 3',Arial,sans-serif;background:var(--of);color:var(--bk)}
h1,h2,h3,.hd{font-family:Oswald,Impact,sans-serif;font-weight:600;letter-spacing:.04em;margin:0}
button,.b{font:inherit;font-weight:600;background:var(--ol);color:#fff;border:1px solid var(--bk);padding:6px 12px;cursor:pointer}button:hover{background:var(--dg)}.b.g{background:var(--of);color:var(--bk)}.b.s{padding:2px 7px;font-size:13px}
input,select{font:inherit;padding:6px;border:1px solid var(--bd);background:#fff;width:100%}
#login{min-height:100vh;display:grid;place-items:center;background:var(--dg)}
#login form{background:var(--of);border:3px solid var(--kh);padding:32px;width:min(420px,92vw);display:grid;gap:10px}
#login h1{font-size:26px;color:var(--dg)}#login p{margin:0 0 8px;color:var(--ol);font-weight:600}
#app{display:none;min-height:100vh}#top{background:var(--dg);color:var(--kh);display:flex;align-items:center;gap:14px;padding:6px 12px;border-bottom:4px solid var(--ol)}
#top h2{font-size:17px;white-space:nowrap}#tn{display:flex;gap:2px;overflow-x:auto;flex:1}#tn a,#sb a{color:var(--of);padding:6px 10px;cursor:pointer;white-space:nowrap;font-size:14px}#tn a:hover,#tn a.on{background:var(--ol)}
#wrap{display:flex;min-height:calc(100vh - 52px)}#sb{width:150px;background:var(--bk);padding-top:6px;flex:none}#sb a{display:block;border-left:4px solid transparent}#sb a.on{border-color:var(--kh);background:var(--dg)}#sb.c{width:44px}#sb.c a span{display:none}
#main{flex:1;padding:14px;min-width:0}.grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--ol);padding:10px 12px}.card .n{font:600 26px Oswald;line-height:1.1}.card small{color:#555;display:block}.card h4{margin:0 0 4px;font:600 13px Oswald;letter-spacing:.06em;color:var(--ol)}
.card.R,.card.CRITICAL{border-left-color:var(--r)}.card.HIGH{border-left-color:var(--o)}.card.MODERATE{border-left-color:var(--a)}.card.LOW{border-left-color:var(--g)}
.panel{background:#fff;border:1px solid var(--bd);padding:10px;margin-bottom:12px}.panel>h3{background:var(--ol);color:#fff;margin:-10px -10px 10px;padding:6px 10px;font-size:15px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}#sb{display:none}}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--dg);color:var(--kh);text-align:left;padding:6px;white-space:nowrap;cursor:default}th[data-k]{cursor:pointer}td{padding:5px 6px;border-bottom:1px solid #ddd5b8;white-space:nowrap}tr:hover td{background:#f7f4e4}
.p{padding:1px 8px;font-size:12px;font-weight:700;color:#fff;border-radius:2px}.p.g{background:var(--g)}.p.a{background:var(--a);color:#000}.p.o{background:var(--o)}.p.r{background:var(--r)}.p.b{background:var(--b)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:end}.bar>*{width:auto;min-width:130px}.bar label{font-size:12px;font-weight:600}
.map{height:430px;border:1px solid var(--bk)}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.cg canvas{max-height:230px}
#modal{display:none;position:fixed;inset:0;background:#000a;place-items:center;z-index:999}#modal.on{display:grid}.box{background:var(--of);border:3px solid var(--kh);padding:18px;width:min(460px,94vw);max-height:90vh;overflow:auto;display:grid;gap:8px}.box label{font-weight:600;font-size:13px}.row{display:flex;gap:8px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--r);color:#fff;padding:10px 16px;display:none;z-index:1000;max-width:80vw}#toast.show{display:block}#toast.ok{background:var(--g)}
.rt{border:2px solid var(--bd);padding:10px;background:#fff;cursor:pointer}.rt.rec{border-color:var(--g)}.rt.sel{outline:3px solid var(--kh)}ul{margin:4px 0;padding-left:18px}.bb{height:8px;background:#ddd}.bb i{display:block;height:8px}
@media print{#top,#sb,.bar,button{display:none!important}}
</style></head><body>
<div id="login"><form id="lf"><h1>DEFENCE LOGISTICS MANAGEMENT SYSTEM</h1><p>AI-POWERED PREDICTIVE LOGISTICS PLATFORM</p>
<input name="username" placeholder="Username" autocomplete="username"><input name="password" type="password" placeholder="Password" autocomplete="current-password">
<button>Login</button><button type="button" class="b g" onclick="demo()">Demo Login</button><small>Demo: admin/admin123 · officer/officer123 · viewer/viewer123 (read-only)</small></form></div>
<div id="app"><div id="top"><button class="b g s" onclick="$('#sb').classList.toggle('c')">☰</button><h2>DEFENCE LOGISTICS COMMAND</h2><div id="tn"></div><span id="who"></span><button class="b s" onclick="location.reload()">Logout</button></div>
<div id="wrap"><div id="sb"></div><div id="main"></div></div></div><div id="modal"></div><div id="toast"></div>
<script>
let TOKEN='',USER={},CH={},MP={},LOCS=[],INV=[],SORT='id',DIR=1;const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString('en-IN'),W=()=>USER.role!=='VIEWER';
const CAT=['Food','Fuel','Medical Supplies','Clothing','Spare Parts','General Supplies'],VT=['Light Truck','Heavy Truck','Tanker','Mule Convoy','Utility Vehicle'];
const C={NORMAL:'g',LOW:'a',CRITICAL:'r',INFO:'b',WARNING:'a',HIGH:'o',MODERATE:'a',MEDIUM:'a',AVAILABLE:'g','IN TRANSIT':'b',MAINTENANCE:'r',ASSIGNED:'a'};
const pill=s=>`<span class="p ${C[s]||'b'}">${s}</span>`,rp=s=>`<span class="p ${s=='LOW'?'g':C[s]}">${s}</span>`,opt=(a,v)=>a.map(x=>`<option value="${x[0]}" ${x[0]==v?'selected':''}>${x[1]}</option>`).join(''),lo=()=>LOCS.map(l=>[l.id,l.name]);
const toast=(m,ok)=>{const t=$('#toast');t.textContent=m;t.className='show '+(ok?'ok':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3800)};
const api=async(p,m='GET',b)=>{const r=await fetch('https://dlms-api-a2vw.onrender.com/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:TOKEN},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){toast(typeof j.detail=='string'?j.detail:'Request could not be completed.');throw j}return j};
const mc=()=>$('#modal').className='',info=h=>{$('#modal').innerHTML=`<div class=box>${h}<button onclick="mc()">Close</button></div>`;$('#modal').className='on'};
function form(t,f,v,cb){const m=$('#modal');m.innerHTML=`<form class=box><h3>${t}</h3>${f.map(([k,l,ty,o])=>`<label>${l}${ty=='select'?`<select name=${k}>${opt(o,v[k])}</select>`:`<input name=${k} type=${ty||'text'} step=any value="${v[k]??''}">`}</label>`).join('')}<div class=row><button>Save</button><button type=button class="b g" onclick="mc()">Cancel</button></div></form>`;m.className='on';m.firstChild.onsubmit=async e=>{e.preventDefault();try{await cb(Object.fromEntries(new FormData(e.target)));mc()}catch(x){}}}
const tbl=(cols,rows)=>`<div class=tw><table><thead><tr>${cols.map(c=>`<th ${c[2]?`data-k="${c[2]}"`:''}>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')||'<tr><td>No records match.</td></tr>'}</tbody></table></div>`;
function ch(id,type,labels,ds,o={}){CH[id]&&CH[id].destroy();const e=document.getElementById(id);if(!e)return;CH[id]=new Chart(e,{type,data:{labels,datasets:ds},options:{responsive:true,plugins:{legend:{display:ds.length>1}},...o}})}
function mkMap(id){MP[id]&&MP[id].remove();const m=L.map(id).setView([31.4,77.4],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);return MP[id]=m}
const hav=(a,b)=>{const p=Math.PI/180,x=Math.sin((b.lat-a.lat)*p/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lon-a.lon)*p/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const NAV=[['dash','Dashboard','DB'],['inv','Inventory','IN'],['fc','Demand Forecast','FC'],['rt','Logistics Routes','RT'],['veh','Transportation','TR'],['wx','Weather & Terrain','WX'],['al','Alerts','AL'],['rep','Reports','RP'],['set','Settings','ST']];
async function enter(r){TOKEN=r.token;USER=r;$('#login').style.display='none';$('#app').style.display='block';$('#who').textContent=r.username+' ['+r.role+']';
$('#tn').innerHTML=NAV.map(n=>`<a data-k=${n[0]}>${n[1]}</a>`).join('');$('#sb').innerHTML=NAV.map(n=>`<a data-k=${n[0]} title="${n[1]}"><b>${n[2]}</b> <span>${n[1].split(' ')[0]}</span></a>`).join('');
document.querySelectorAll('#tn a,#sb a').forEach(a=>a.onclick=()=>go(a.dataset.k));LOCS=await api('/locations');go('dash')}
$('#lf').onsubmit=async e=>{e.preventDefault();try{enter(await api('/login','POST',Object.fromEntries(new FormData(e.target))))}catch(x){}};
const demo=async()=>enter(await api('/demo-login','POST'));
async function go(k){document.querySelectorAll('#tn a,#sb a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));$('#main').innerHTML='<p>Loading…</p>';try{await V[k]()}catch(x){}}
const V={};
// ---------- DASHBOARD ----------
let MD=[],LG;
V.dash=async()=>{const[d,m]=await Promise.all([api('/dashboard'),api('/map')]);MD=m;const v=d.vs;
$('#main').innerHTML=`<div class=grid6>
<div class=card><h4>TOTAL INVENTORY</h4><div class=n>${d.items} items</div><small>Stock value ₹${fmt(d.value)} · ${d.critical} critical</small></div>
<div class=card><h4>ACTIVE LOCATIONS</h4><div class=n>${d.locations}</div><small>${d.forward} forward · ${d.warehouses} depots/hubs</small></div>
<div class="card ${d.critical?'R':''}"><h4>CRITICAL STOCK</h4><div class=n>${d.critical}</div><small>${d.crit_pct}% of items · ${d.low} low</small></div>
<div class=card><h4>VEHICLES</h4><div class=n>${d.vehicles}</div><small>${v.AVAILABLE||0} available · ${v['IN TRANSIT']||0} transit · ${v.MAINTENANCE||0} maint.</small></div>
<div class=card><h4>PENDING RESUPPLY</h4><div class=n>${d.pending}</div><small>${d.prio.CRITICAL} critical · ${d.prio.HIGH} high · ${d.prio.MEDIUM} medium</small></div>
<div class="card ${d.risk}"><h4>RISK LEVEL</h4><div class=n>${d.risk}</div><small>Score ${d.risk_score}/100</small></div></div>
<div class=two><div class=panel><h3>LIVE OPERATIONAL MAP (fictional locations)</h3><div class=bar><input id=ms placeholder="Search location" style="min-width:170px"><select id=mf><option value="">All status</option><option>NORMAL</option><option>LOW</option><option>CRITICAL</option><option value=DEPOT>Depots</option></select><label><input type=checkbox id=mr style="width:auto"> Routes</label><label><input type=checkbox id=mw style="width:auto"> Weather risk</label></div><div id=map class=map></div></div>
<div class=panel><h3>ACTION REQUIRED – NEXT SHORTAGES</h3>${d.top.map(s=>`<div class="card ${s.priority=='CRITICAL'?'R':s.priority}" style="margin-bottom:6px"><b>${s.location}</b> – ${s.name} ${pill(s.priority)}<small>Stock ${fmt(s.qty)} · ${fmt(s.daily)}/day · shortage in ~${s.shortage_day||'15+'} days · send ${fmt(s.recommended)}</small>${W()?`<button class="b s" onclick="plan(${s.id})">GENERATE RESUPPLY PLAN</button>`:''}</div>`).join('')||'No shortages predicted.'}${W()?'<button class="b g" onclick="loadDemo()">LOAD DEMO DATA</button>':''}</div></div>
<div class=panel><h3>ANALYTICS</h3><div class=bar><div><label>Location</label><select id=af><option value=0>All</option>${opt(lo())}</select></div><div><label>Category</label><select id=ac><option value="">All</option>${CAT.map(c=>`<option>${c}</option>`)}</select></div></div>
<div class=cg>${['c1','c2','c3','c4','c5','c6'].map(i=>`<div><canvas id=${i}></canvas></div>`).join('')}</div></div>`;
const mp=mkMap('map');LG=L.layerGroup().addTo(mp);['ms','mf','mr','mw'].forEach(i=>$('#'+i).oninput=drawMap);drawMap();$('#af').onchange=$('#ac').onchange=ana;ana()};
function drawMap(){LG.clearLayers();const q=$('#ms').value.toLowerCase(),f=$('#mf').value,mp=MP.map,dep=l=>['DEPOT','HUB'].includes(l.type),vis=MD.filter(l=>l.name.toLowerCase().includes(q)&&(!f||(f=='DEPOT'?dep(l):l.status==f)));
vis.forEach(l=>{const c=dep(l)?'#2a5d9f':{NORMAL:'#2e7d32',LOW:'#e6a700',CRITICAL:'#c62828'}[l.status];
L.circleMarker([l.lat,l.lon],{radius:10,color:'#000',weight:1,fillColor:c,fillOpacity:.95}).bindPopup(`<b>${l.name}</b> (${l.type})<br>Inventory: ${fmt(l.stock)} units<br>Daily consumption: ${fmt(l.daily)}<br>Days of stock (lowest item): ${l.days}<br>Risk: ${l.risk}<br>Last supply: ${l.last_supply}<br>Next recommended: ${l.next_supply}`).addTo(LG);
if($('#mw').checked)L.circle([l.lat,l.lon],{radius:l.weather_risk*350,color:l.weather_risk>=50?'#c62828':'#e6a700',weight:1,fillOpacity:.15}).addTo(LG);
if($('#mr').checked&&!dep(l)){const D=MD.filter(dep).sort((a,b)=>hav(a,l)-hav(b,l))[0];D&&L.polyline([[D.lat,D.lon],[l.lat,l.lon]],{color:'#4b5a2f',dashArray:'6'}).addTo(LG)}});
if(q&&vis.length)mp.flyTo([vis[0].lat,vis[0].lon],11)}
async function ana(){const a=await api(`/analytics?loc=${$('#af').value}&cat=${encodeURIComponent($('#ac').value)}`),G='#4b5a2f',K='#c9b98b',R='#c62828';
const t=(x)=>({plugins:{title:{display:true,text:x}}}),n=a.daily.length;
ch('c1','line',[...a.days,...a.forecast.map((_,i)=>'+'+(i+1)+'d')],[{label:'Daily consumption',data:a.daily,borderColor:G},{label:'Forecast',data:[...Array(n).fill(null),...a.forecast],borderColor:R,borderDash:[5,4]}],t('Daily consumption & forecast demand'));
ch('c2','line',a.days,[{data:a.trend,borderColor:'#1c2a1a',fill:true,backgroundColor:'#c9b98b55'}],t('Inventory trend'));
ch('c3','bar',Object.keys(a.byloc),[{data:Object.values(a.byloc).map(Math.round),backgroundColor:G}],t('Location-wise daily demand'));
ch('c4','bar',Object.keys(a.critcat),[{data:Object.values(a.critcat),backgroundColor:R}],t('Critical stock by category'));
ch('c5','doughnut',Object.keys(a.vs),[{data:Object.values(a.vs),backgroundColor:['#2e7d32','#2a5d9f','#c62828','#e6a700']}],t('Vehicle utilisation'));
ch('c6','bar',Object.keys(a.delays),[{data:Object.values(a.delays),backgroundColor:'#e0701a'}],t('Weather-driven supply delay (hours)'))}
const loadDemo=async()=>{await api('/demo/load','POST');toast('Demo data loaded.',1);go('dash')};
async function plan(id){const p=await api('/resupply/plan','POST',{inventory_id:id});info(`<h3>RESUPPLY PLAN – ${p.priority}</h3><b>${p.item}</b> for ${p.location}<ul><li>Required quantity: <b>${fmt(p.qty)}</b> units</li><li>Suggested dispatch date: <b>${p.dispatch}</b></li><li>Source depot: <b>${p.source}</b></li><li>Route: ${p.route} (${p.km} km, ${rp(p.route_risk)} risk)</li><li>Estimated delivery time: <b>${p.eta}</b></li><li>Vehicle: ${p.vehicle} (${p.trips} trip/s)</li><li>Predicted shortage: day ${p.shortage_day||'15+'}</li></ul>`);}
// ---------- INVENTORY ----------
V.inv=async()=>{INV=await api('/inventory');$('#main').innerHTML=`<div class=panel><h3>INVENTORY MANAGEMENT</h3><div class=bar><input id=q placeholder="Search item / ID / location"><select id=fc><option value="">All categories</option>${CAT.map(c=>`<option>${c}</option>`)}</select><select id=fs><option value="">All status</option><option>NORMAL</option><option>LOW</option><option>CRITICAL</option></select>${W()?'<button onclick="invForm()">+ Add Item</button>':''}</div><div id=it></div></div>`;['q','fc','fs'].forEach(i=>$('#'+i).oninput=invR);invR()};
function invR(){const q=$('#q').value.toLowerCase(),c=$('#fc').value,s=$('#fs').value;let r=INV.filter(i=>(!c||i.category==c)&&(!s||i.status==s)&&(i.name+i.code+i.location).toLowerCase().includes(q)).sort((a,b)=>(a[SORT]>b[SORT]?1:-1)*DIR);
$('#it').innerHTML=tbl([['Item ID',i=>i.code,'code'],['Item Name',i=>i.name,'name'],['Category',i=>i.category,'category'],['Location',i=>i.location,'location'],['Qty',i=>fmt(i.qty),'qty'],['Min Threshold',i=>fmt(i.threshold),'threshold'],['Daily Use',i=>fmt(i.daily),'daily'],['Days Left',i=>i.days,'days'],['Status',i=>pill(i.status),'status'],['Updated',i=>i.updated,'updated'],['Actions',i=>`<button class="b g s" onclick="invView(${i.id})">View</button>${W()?` <button class="b s" onclick="invQty(${i.id})">Qty</button> <button class="b s" onclick="invForm(${i.id})">Edit</button> <button class="b s" style="background:var(--r)" onclick="invDel(${i.id})">Del</button>`:''}`]],r);
document.querySelectorAll('#it th[data-k]').forEach(h=>h.onclick=()=>{DIR=SORT==h.dataset.k?-DIR:1;SORT=h.dataset.k;invR()})}
const invView=id=>{const i=INV.find(x=>x.id==id);info(`<h3>${i.name} (${i.code})</h3>Category: ${i.category}<br>Location: ${i.location}<br>Quantity: ${fmt(i.qty)} / threshold ${fmt(i.threshold)}<br>Daily consumption: ${fmt(i.daily)}<br>Days remaining: ${i.qty} ÷ ${i.daily} = <b>${i.days}</b><br>Status: ${pill(i.status)}<br>Stock value: ₹${fmt(i.qty*i.unit_value)}<br>Updated: ${i.updated}`)};
const invForm=id=>{const v=INV.find(x=>x.id==id)||{category:'Food',location_id:LOCS[0].id};form(id?'Edit Item':'Add Item',[['name','Item name'],['category','Category','select',CAT.map(c=>[c,c])],['location_id','Location','select',lo()],['qty','Current quantity','number'],['threshold','Minimum threshold','number'],['daily','Daily consumption','number'],['unit_value','Unit value (₹)','number']],v,async d=>{await api('/crud/inventory'+(id?'/'+id:''),id?'PUT':'POST',d);toast('Item saved.',1);V.inv()})};
const invQty=id=>{const i=INV.find(x=>x.id==id);form('Update Quantity – '+i.name,[['qty','New quantity','number']],i,async d=>{await api('/crud/inventory/'+id,'PUT',d);toast('Quantity updated.',1);V.inv()})};
const invDel=async id=>{if(confirm('Delete this item and its history?')){await api('/crud/inventory/'+id,'DELETE');toast('Item deleted.',1);V.inv()}};
// ---------- FORECAST ----------
V.fc=async()=>{INV=await api('/inventory');const R=await api('/resupply');$('#main').innerHTML=`<div class=panel><h3>AI DEMAND FORECAST</h3><div class=bar><div><label>Location</label><select id=fl>${opt(lo())}</select></div><div><label>Item</label><select id=fi></select></div><div><label>Period</label><select id=fd><option value=7>7 days</option><option value=15>15 days</option><option value=30>30 days</option></select></div><button onclick="runFc()">Generate forecast</button></div><div id=fr></div></div>
<div class=panel><h3>SMART RESUPPLY RECOMMENDATIONS</h3>${tbl([['Location',s=>s.location],['Item',s=>s.name],['Stock',s=>fmt(s.qty)],['Avg/day',s=>fmt(s.daily)],['Predicted 15d',s=>fmt(s.predicted)],['Shortage in',s=>(s.shortage_day||'15+')+' days'],['Recommend',s=>fmt(s.recommended)],['Priority',s=>rp(s.priority)],['',s=>W()?`<button class="b s" onclick="plan(${s.id})">GENERATE RESUPPLY PLAN</button>`:'']],R)}</div>`;
const fill=()=>$('#fi').innerHTML=opt(INV.filter(i=>i.location_id==$('#fl').value).map(i=>[i.id,i.name]));$('#fl').onchange=fill;fill()};
async function runFc(){const i=$('#fi').value;if(!i)return toast('Unable to generate forecast. Select an item with historical data.');const f=await api(`/forecast?inventory_id=${i}&days=${$('#fd').value}`);
$('#fr').innerHTML=`<div class=grid6><div class=card><h4>PREDICTED DEMAND</h4><div class=n>${fmt(f.total)}</div><small>next ${f.pred.length} days · stock ${fmt(f.item.qty)}</small></div><div class=card><h4>EXPECTED SHORTAGE</h4><div class=n>${f.shortage_date||'None'}</div><small>probability ${Math.round(f.prob*100)}% ${rp(f.level)}</small></div><div class=card><h4>RECOMMENDED QTY</h4><div class=n>${fmt(f.recommended)}</div></div><div class=card><h4>CONFIDENCE</h4><div class=n>${f.confidence}%</div></div></div><canvas id=fch style="max-height:300px"></canvas><b>Why this recommendation:</b><ul>${f.why.map(w=>`<li>${w}</li>`).join('')}</ul>`;
const h=f.hist,n=h.length;ch('fch','line',[...h.map(x=>x.day),...f.dates],[{label:'Historical',data:h.map(x=>x.qty),borderColor:'#4b5a2f'},{label:'Predicted',data:[...Array(n-1).fill(null),h[n-1].qty,...f.pred],borderColor:'#c62828',borderDash:[5,4]}])}
// ---------- ROUTES ----------
V.rt=async()=>{$('#main').innerHTML=`<div class=panel><h3>ROUTE OPTIMISATION</h3><div class=bar><div><label>Source</label><select id=rs>${opt(lo())}</select></div><div><label>Destination</label><select id=rd><option value="">Select…</option>${opt(lo())}</select></div><div><label>Vehicle</label><select id=rv>${VT.map(v=>`<option>${v}</option>`)}</select></div><div><label>Quantity</label><input id=rq type=number value=1000></div><button onclick="calcRt()">Calculate routes</button></div><div id=rr></div><div id=rm class=map style="margin-top:10px"></div></div>`;mkMap('rm')};
let RT=[];async function calcRt(){const r=await api('/route','POST',{source_id:$('#rs').value,destination_id:$('#rd').value,vehicle_type:$('#rv').value,qty:$('#rq').value});RT=r.routes;
$('#rr').innerHTML=(r.warning?`<p style="color:var(--r)"><b>${r.warning}</b></p>`:'')+`<div class=cg>${RT.map((x,i)=>`<div class="rt ${x.recommended?'rec':''}" onclick="showRt(${i})"><b>${x.name}</b> ${x.recommended?pill('NORMAL').replace('NORMAL','RECOMMENDED'):''}<br>Distance: ${x.km} km<br>Time: ${x.time}<br>Terrain difficulty: ${x.terrain}/5 · Weather risk: ${x.weather_risk}<br>Risk: ${rp(x.level)} (${x.risk}/100)<br>Vehicle capacity ${fmt(r.capacity)} · ${r.trips} trip/s</div>`).join('')}</div>`;showRt(RT.findIndex(x=>x.recommended))}
function showRt(i){const m=mkMap('rm'),x=RT[i];document.querySelectorAll('.rt').forEach((e,k)=>e.classList.toggle('sel',k==i));RT.forEach((y,k)=>k!=i&&L.polyline(y.path,{color:'#999',weight:3,dashArray:'4'}).addTo(m));const l=L.polyline(x.path,{color:x.risk>=50?'#c62828':'#2e7d32',weight:6}).addTo(m);m.fitBounds(l.getBounds().pad(.3));x.path.filter((_,k)=>k!=1).forEach(p=>L.circleMarker(p,{radius:7,color:'#000',fillColor:'#c9b98b',fillOpacity:1}).addTo(m))}
// ---------- TRANSPORT ----------
V.veh=async()=>{const v=await api('/vehicles');window.VH=v;$('#main').innerHTML=`<div class=panel><h3>TRANSPORTATION MANAGEMENT</h3><div class=bar>${W()?'<button onclick="vForm()">+ Add Vehicle</button>':''}</div>${tbl([['Vehicle ID',x=>x.code],['Type',x=>x.type],['Capacity',x=>fmt(x.capacity)],['Current Location',x=>x.location||'-'],['Destination',x=>x.destination||'-'],['Status',x=>pill(x.status)],['ETA',x=>x.eta||'-'],['Actions',x=>`<button class="b g s" onclick="vTrack(${x.id})">Track</button>${W()?` <button class="b s" onclick="vAssign(${x.id})">Assign</button> <button class="b s" onclick="vForm(${x.id})">Edit</button> <button class="b s" onclick="vStat(${x.id})">Status</button>`:''}`]],v)}</div>`};
const vForm=id=>{const v=VH.find(x=>x.id==id)||{type:'Heavy Truck',status:'AVAILABLE',location_id:LOCS[0].id};form(id?'Edit Vehicle':'Add Vehicle',[['code','Vehicle ID'],['type','Type','select',VT.map(t=>[t,t])],['capacity','Capacity (units)','number'],['location_id','Current location','select',lo()]],v,async d=>{await api('/crud/vehicles'+(id?'/'+id:''),id?'PUT':'POST',d);toast('Vehicle saved.',1);V.veh()})};
const vStat=id=>form('Update Status',[['status','Status','select',['AVAILABLE','IN TRANSIT','MAINTENANCE','ASSIGNED'].map(s=>[s,s])]],VH.find(x=>x.id==id),async d=>{await api('/crud/vehicles/'+id,'PUT',d);toast('Status updated.',1);V.veh()});
const vAssign=id=>form('Assign Vehicle',[['dest_id','Destination','select',[['','Select…'],...lo()]],['qty','Load quantity','number']],{},async d=>{await api(`/vehicles/${id}/assign`,'POST',d);toast('Vehicle assigned.',1);V.veh()});
const vTrack=id=>{const v=VH.find(x=>x.id==id);info(`<h3>${v.code} – ${v.type}</h3>Status: ${pill(v.status)}<br>Position: ${v.location||'unknown'}<br>Destination: ${v.destination||'none'}<br>ETA: ${v.eta||'n/a'}`)};
// ---------- WEATHER ----------
V.wx=async()=>{const w=await api('/weather');window.WX=w;$('#main').innerHTML=`<div class=panel><h3>WEATHER & TERRAIN – ROUTE RISK IMPACT</h3><div class=cg>${w.map(x=>`<div class="card ${x.level=='CRITICAL'?'R':x.level}"><b>${x.location}</b> ${rp(x.level)}<div class=bb><i style="width:${x.risk}%;background:${x.risk>=50?'#c62828':'#4b5a2f'}"></i></div>${x.cond} · ${x.temp}°C · Rain ${x.rain} mm · Vis ${x.visibility} km · Wind ${x.wind} km/h<br>Road: ${x.road} · Terrain: ${x.terrain}/5<br><b>Impact:</b> route risk ${x.risk}/100 → travel time +${x.delay_pct}% · resupply delay ~${x.delay_h} h ${W()?`<br><button class="b s" onclick="wxEdit(${x.location_id})">Update conditions</button>`:''}</div>`).join('')}</div></div>`};
const wxEdit=id=>form('Update Weather',[['cond','Condition','select',['Clear','Fog','Rain','Heavy Rain','Snow'].map(s=>[s,s])],['temp','Temperature °C','number'],['rain','Rainfall mm','number'],['visibility','Visibility km (0-10)','number'],['wind','Wind km/h','number'],['road','Road condition','select',['GOOD','FAIR','POOR','BLOCKED'].map(s=>[s,s])],['terrain','Terrain difficulty (1-5)','number']],WX.find(x=>x.location_id==id),async d=>{await api('/weather/'+id,'PUT',d);toast('Weather updated; risks and alerts recalculated.',1);V.wx()});
// ---------- ALERTS ----------
V.al=async()=>{const s=$('#fsv')?$('#fsv').value:'';const a=await api('/alerts?severity='+s);$('#main').innerHTML=`<div class=panel><h3>ALERTS</h3><div class=bar><select id=fsv><option value="">All severities</option>${['CRITICAL','HIGH','WARNING','INFO'].map(x=>`<option ${x==s?'selected':''}>${x}</option>`)}</select>${W()?'<button onclick="scanNow()">Run alert scan</button>':''}</div>${tbl([['Time',x=>x.ts],['Location',x=>x.location],['Category',x=>x.category],['Message',x=>`<span style="white-space:normal;display:block;min-width:260px;font-weight:${x.is_read?400:700}">${x.msg}</span>`],['Severity',x=>pill(x.severity)],['Recommended action',x=>x.action],['',x=>W()?`<button class="b g s" onclick="alAct(${x.id},'read')">Mark read</button> <button class="b s" onclick="alAct(${x.id},'resolve')">Resolve</button>`:'']],a)}</div>`;$('#fsv').onchange=V.al};
const alAct=async(i,a)=>{await api(`/alerts/${i}/${a}`,'POST');V.al()},scanNow=async()=>{await api('/scan','POST');toast('Scan complete.',1);V.al()};
// ---------- REPORTS ----------
V.rep=async()=>{$('#main').innerHTML=`<div class=panel><h3>REPORTS</h3><div class=bar><select id=rk>${[['inventory','Inventory Report'],['forecast','Demand Forecast Report'],['transport','Transportation Report'],['route','Route Risk Report'],['daily','Daily Logistics Summary']].map(x=>`<option value=${x[0]}>${x[1]}</option>`)}</select><button onclick="genRep()">Generate</button><button class="b g" onclick="dlRep()">Download CSV</button><button class="b g" onclick="print()">Print / Save PDF</button></div><canvas id=rch style="max-height:240px"></canvas><div id=rb></div></div>`;genRep()};
let RD=[];async function genRep(){RD=await api('/report/'+$('#rk').value);const k=RD[0]?Object.keys(RD[0]):[];$('#rb').innerHTML=tbl(k.map(c=>[c,r=>r[c]??'-']),RD);const n=k.find(c=>typeof RD[0][c]=='number');n?ch('rch','bar',RD.map(r=>r[k[1]]||r[k[0]]),[{label:n,data:RD.map(r=>r[n]),backgroundColor:'#4b5a2f'}]):CH.rch&&CH.rch.destroy()}
function dlRep(){if(!RD.length)return toast('Nothing to download.');const k=Object.keys(RD[0]),c=[k.join(','),...RD.map(r=>k.map(x=>JSON.stringify(r[x]??'')).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=$('#rk').value+'_report.csv';a.click()}
// ---------- SETTINGS ----------
V.set=async()=>{$('#main').innerHTML=`<div class=panel><h3>SETTINGS</h3><p>Signed in as <b>${USER.username}</b> – role <b>${USER.role}</b>${W()?'':' (read-only)'}.</p>${W()?'<button onclick="loadDemo()">LOAD DEMO DATA</button> ':''}<a class="b g" href="https://dlms-api-a2vw.onrender.com" target="_blank" style="text-decoration:none;padding:6px 12px;display:inline-block">API documentation</a><ul><li>ADMIN – full access</li><li>LOGISTICS OFFICER – read/write</li><li>VIEWER – read-only</li></ul><p>All demo data is fictional.</p></div>`};
</script></body></html>
